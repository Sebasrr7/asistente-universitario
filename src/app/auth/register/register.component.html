
<div class="login-container">
  <div class="login-card">

    <h2>Crear cuenta</h2>
    <p class="subtitle">Ingresa tus datos para registrarte</p>

    <form [formGroup]="formRegister" (ngSubmit)="registrarUsuario()">

      <!-- Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          formControlName="nombre"
          type="text"
          id="nombre"
          placeholder="Ingresa tu nombre"
        >

        <small *ngIf="formRegister.get('nombre')?.touched && formRegister.get('nombre')?.invalid">
          El nombre es obligatorio.
        </small>
      </div>

      <!-- Correo -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          placeholder="tu@correo.com"
        >

        <small *ngIf="formRegister.get('email')?.touched && formRegister.get('email')?.hasError('required')">
          El correo es obligatorio.
        </small>

        <small *ngIf="formRegister.get('email')?.touched && formRegister.get('email')?.hasError('email')">
          Ingresa un correo válido.
        </small>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          formControlName="password"
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
        >

        <small *ngIf="formRegister.get('password')?.touched && formRegister.get('password')?.hasError('required')">
          La contraseña es obligatoria.
        </small>

        <small *ngIf="formRegister.get('password')?.touched && formRegister.get('password')?.hasError('minlength')">
          La contraseña debe tener mínimo 6 caracteres.
        </small>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          formControlName="confirmarPassword"
          type="password"
          id="confirmarPassword"
          placeholder="Confirma tu contraseña"
        >

        <small *ngIf="formRegister.get('confirmarPassword')?.touched && formRegister.get('confirmarPassword')?.invalid">
          Debes confirmar tu contraseña.
        </small>

        <small *ngIf="formRegister.get('confirmarPassword')?.touched && formRegister.hasError('noCoinciden')">
          Las contraseñas no coinciden.
        </small>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="formRegister.invalid">
        Registrarse
      </button>

    </form>

  </div>
</div>
